  <circle cx="1270" cy="240" r="170" stroke="#5EEAD4" stroke-opacity=".12"/>
  <circle cx="1270" cy="240" r="126" stroke="#5EEAD4" stroke-opacity=".1" stroke-dasharray="5 12"/>
