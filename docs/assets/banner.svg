    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#FFFFFF" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1600" height="480" rx="24" fill="url(#bg)"/>
