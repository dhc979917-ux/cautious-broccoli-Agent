# Nginx配置文件 - 企业级Agent平台网关

# 工作进程数（auto表示自动检测CPU核心数）
worker_processes auto;

# 错误日志路径
error_log /var/log/nginx/error.log warn;

# 进程ID文件
pid /var/run/nginx.pid;

events {
    # 每个工作进程的最大连接数
    worker_connections 1024;
}

http {
    # 包含MIME类型定义
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 访问日志
    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;           # 启用高效文件传输
    tcp_nopush on;         # 优化TCP数据包发送
    tcp_nodelay on;        # 禁用Nagle算法，减少延迟
    keepalive_timeout 65;  # 保持连接超时时间

    # Gzip压缩（减少传输体积）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml;

    # 上传文件大小限制（与后端 MAX_FILE_SIZE 对齐）
    client_max_body_size 200m;

    # 上游服务器定义（后端服务）
    upstream backend {
        server backend:8000;  # Docker容器内的后端服务
        # 如果是本地开发，改成：server localhost:8000;
    }

    # 服务器配置
    server {
        listen 80;
        server_tokens off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        server_name localhost;  # 生产环境改成你的域名

        # 前端静态文件
        location / {
            root /usr/share/nginx/html;  # Docker容器内的前端文件路径
            # 如果是本地开发，改成前端构建产物目录，如：root /path/to/frontend/dist;

        # 单页应用路由支持（所有路径都返回index.html）
            try_files $uri $uri/ /index.html;

            # HTML must never be cached so new asset hashes are picked up immediately
            add_header Cache-Control "no-cache" always;

            # Only /assets/ files are content-hashed by the build, so they can
            # be cached immutably; root-level public files (favicon, logos)
            # keep stable URLs and must always revalidate.
            location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # WebSocket代理（聊天实时通信）
        # 注意：必须放在 /api/ 之前，location 前缀匹配取最长者
        location /api/v1/ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket必需的头部
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # WebSocket长连接超时（1小时）
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # API接口代理（转发到后端）
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # 传递真实IP
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # 健康检查接口
        location /health {
            proxy_pass http://backend/health;
        }

        location /ready {
            proxy_pass http://backend/ready;
        }

        # 禁止访问隐藏文件
        location ~ /\. {
            deny all;
        }
    }

    # HTTPS配置（生产环境启用）
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     # ... 其他配置同上 ...
    # }
}
