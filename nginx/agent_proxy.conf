# ============================================================
# Agent 平台反向代理配置（裸机部署）
#
# 部署路径: /etc/nginx/conf.d/agent_proxy.conf
# 功能: 统一入口(80) + IP白名单 + basic_auth + 隐藏后端端口
#
# 使用前:
#   1. 将 <SERVER_PUBLIC_IP> 替换为服务器公网IP
#   2. 创建 htpasswd 密码文件 (见 DEPLOY_PROXY.md)
#   3. 确保 /opt/agent_platform/frontend/dist 存在 (npm run build 产物)
#   4. 移除 /etc/nginx/conf.d/default.conf (避免冲突)
# ============================================================

# ============================================================
# upstream: 后端应用地址
# !!! 后端IP变更时只需修改下面这一行 !!!
# 当前: 本机 127.0.0.1:8080
# 变更示例: server 10.0.1.100:8080;
# ============================================================
upstream backend_app {
    server 127.0.0.1:8080;
}

# ============================================================
# 默认server: 拦截未匹配Host的请求，返回403
# 防止通过IP直接访问时暴露nginx默认欢迎页
# ============================================================
server {
    listen 80 default_server;
    server_name _;
    return 403;
}

# ============================================================
# 主server: 处理正常业务流量
# ============================================================
server {
    listen 80;
    # 替换为你的服务器公网IP，如 203.0.113.50
    # 也可追加 127.0.0.1 localhost 方便本机调试
    server_name <SERVER_PUBLIC_IP>;

    # ----------------------------------------------------------
    # IP白名单: 只允许指定IP段访问
    # 修改方法: 将下面这行改成你的IP段，可添加多行 allow
    # 示例:
    #   allow 10.0.0.0/8;
    #   allow 192.168.1.0/24;
    #   allow 172.16.0.0/12;
    # 最后必须 deny all 兜底
    # ----------------------------------------------------------
    allow 192.168.1.0/24;
    deny all;

    # ----------------------------------------------------------
    # basic_auth 全站认证
    # 所有路径都需要输入用户名密码才能访问
    # 密码文件: /etc/nginx/.htpasswd (见 DEPLOY_PROXY.md 创建方法)
    # ----------------------------------------------------------
    auth_basic "Restricted Area";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 上传大小限制（与后端对齐）
    client_max_body_size 50m;

    # ----------------------------------------------------------
    # 前端SPA静态文件
    # ----------------------------------------------------------
    location / {
        root /opt/agent_platform/frontend/dist;
        index index.html;
        # 单页应用路由: 所有路径回退到 index.html
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /opt/agent_platform/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ----------------------------------------------------------
    # WebSocket 代理（聊天实时通信）
    # 必须在 /api/ 之前声明，location 前缀匹配取最长
    # ----------------------------------------------------------
    location /api/v1/ws/ {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;

        # WebSocket 升级头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时（1小时）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----------------------------------------------------------
    # REST API 代理
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_app;
        proxy_http_version 1.1;

        # 传递真实客户端IP给后端
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ----------------------------------------------------------
    # 健康检查（关闭认证，方便监控探测）
    # ----------------------------------------------------------
    location = /health {
        auth_basic off;
        proxy_pass http://backend_app/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 禁止访问隐藏文件（.git, .env 等）
    location ~ /\. {
        deny all;
    }
}
